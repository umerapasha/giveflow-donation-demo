name: Verify donation prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/donation_test.dart
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: python -m pytest backend/test_api.py -q
      - run: python scripts/run_contract_test.py --flutter-bin flutter
      - run: flutter build web --release --no-web-resources-cdn
